<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Code Blue Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      const api = (path, opts={}) =>
        fetch(`${import.meta.env.VITE_API_URL}${path}`, {
          headers: { 'Content-Type':'application/json', ...(opts.headers||{}) },
          ...opts
        }).then(r=>r.json());

      const el = document.getElementById('app');
      el.innerHTML = `
        <style>
          body { font-family: system-ui, Arial; margin: 0; background: #f7f9fb; }
          header { background: #0b4a83; color: white; padding: 12px 16px; }
          .card { background: white; margin: 16px; padding: 16px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
          input, button { padding: 8px; margin: 4px 0; }
          button { background: #0b4a83; color: white; border: none; border-radius: 4px; }
        </style>
        <header><strong>Code Blue Medical Training Institute</strong></header>
        <div class="card">
          <h3>Admin login</h3>
          <input id="email" value="admin@codeblue.local" />
          <input id="password" type="password" value="Admin123!" />
          <button id="loginBtn">Login</button>
          <pre id="out"></pre>
        </div>
      `;
      document.getElementById('loginBtn').onclick = async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const r = await api('/auth/login', { method:'POST', body: JSON.stringify({ email, password }) });
        document.getElementById('out').textContent = JSON.stringify(r, null, 2);
      };
    </script>
  </body>
</html>
