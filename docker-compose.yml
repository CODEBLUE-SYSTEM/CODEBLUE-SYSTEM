version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: codeblue
      POSTGRES_USER: codeblue
      POSTGRES_PASSWORD: codeblue
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://codeblue:codeblue@db:5432/codeblue
      JWT_SECRET: "SuperSecretKey123"
      EMAIL_FROM: "no-reply@codebluemedical.co.ke"
      ENABLE_SMS: "true"
      ENABLE_EMAIL: "true"
    depends_on:
      - db
    ports:
      - "4000:4000"
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: "http://localhost:4000"
    depends_on:
      - backend
    ports:
      - "5173:5173"
volumes:
  db_data:
